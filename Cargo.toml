[package]
name = "cshift"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "A fast, zero-daemon CLI to switch Claude Code model config by rewriting ~/.claude/settings.json"
license = "MIT"
repository = "https://github.com/decheverri123/claude-shift"
homepage = "https://github.com/decheverri123/claude-shift"
documentation = "https://github.com/decheverri123/claude-shift#readme"
keywords = ["cli", "claude", "ai", "model-switcher", "anthropic"]
categories = ["command-line-utilities"]
authors = ["Danny <decheverri123>"]

[[bin]]
name = "cshift"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
console = "0.15"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3"
